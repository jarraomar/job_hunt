# Bay Area cities whose name is more famous somewhere else. These count as
# local ONLY alongside a California signal ("Dublin, CA") or another Bay Area
# city in the same posting.
#
# Bare "Dublin" in a job posting means Ireland far more often than it means
# Alameda County, and treating it as local sent three Dublin-and-London roles
# to the queue as though they were a twenty-minute drive. Unqualified, they
# fall through to `unknown` and pass without claiming to be local -- the safe
# direction, since the cost is a badge rather than a deleted job.
bay_area_ambiguous:
  - dublin      # Ireland, Ohio, Georgia
  - brisbane    # Australia
  - newark      # New Jersey, Delaware
  - richmond    # Virginia, British Columbia
  - concord     # New Hampshire, Massachusetts, North Carolina
  - albany      # New York
  - lafayette   # Louisiana, Indiana
  - danville    # Virginia, Illinois
  - belmont     # Massachusetts, North Carolina
  - union city  # New Jersey, Georgia
  - piedmont    # South Carolina
  - victoria    # British Columbia, Australia

# Scoped to the United States without naming a city. A remote role matching one
