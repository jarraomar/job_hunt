  - anywhere in the united states
  - remote us
  - us remote
  - continental us
  - lower 48
  - conus

# Unrestricted. Includes the US by definition, so a remote role matching one is
# in scope.
anywhere:
  - anywhere
  - worldwide
  - global
  - globally
  - fully distributed
  - distributed

