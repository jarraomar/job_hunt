# Place vocabulary for the location screen (pipeline/filters/location.py).
#
# Data rather than code so the lists can be corrected without touching logic --
# the same reason blocklist.yaml exists. Every term is matched on whole-word
# boundaries against a lowercased place string.
#
# A term appearing in the WRONG list here silently deletes jobs. Before adding
# one, run: ./venv/bin/python scripts/location_report.py --sample <term>

# Commutable from San Leandro, and unambiguous: no well-known city elsewhere
# shares the name. A hybrid or onsite role must match one of these or it is
# rejected, so a missing city here is a missing job.
