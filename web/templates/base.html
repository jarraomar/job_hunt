<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}job_hunt{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# Vendored, not CDN-linked: an external <script src> makes the UI fail
     whenever that CDN does, and reports every page load to a third party.
     htmx 2.0.4, sha256 e209dda5c8235479... #}
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="h-full bg-stone-50 text-stone-900">
  <nav class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3 text-sm">
      <a href="/" class="font-semibold tracking-tight">Job Hunt</a>
      <a href="/" class="text-stone-600 hover:text-stone-900 hover:underline">Queue</a>
      <a href="/tracker" class="text-stone-600 hover:text-stone-900 hover:underline">Tracker</a>
      <a href="/settings" class="text-stone-600 hover:text-stone-900 hover:underline">Settings</a>
    </div>
  </nav>
  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
