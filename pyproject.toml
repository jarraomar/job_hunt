[project]
name = "jobhunt"
version = "0.1.0"
description = "Automated job discovery and application preparation"
# 3.14 is both what this machine runs and a supported Vercel runtime, so local
# and deployed interpreters match exactly. Vercel defaults to 3.12 when unset.
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
