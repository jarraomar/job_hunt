[project]
name = "jobhunt"
version = "0.1.0"
description = "Automated job discovery and application preparation"
# 3.14 is both what this machine runs and a supported Vercel runtime, so local
# and deployed interpreters match exactly. Vercel defaults to 3.12 when unset.
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.117",
    "fastembed>=0.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    # Local only. Vercel supplies its own ASGI server, so this never ships.
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.vercel]
# Explicit rather than relying on filename detection, so moving the file does
# not silently change what Vercel loads.
entrypoint = "api.index:app"

[tool.vercel.scripts]
# Runs after dependencies are installed, so fastembed is importable here.
# Vendors the ONNX embedding model into the bundle; without it every cold start
# would download 65 MB into an ephemeral /tmp and pay for it again next time.
build = "python scripts/vendor_model.py"

[tool.setuptools.packages.find]
include = ["pipeline*", "scripts*", "api*", "web*"]

[tool.setuptools.package-data]
# Templates and the built CSS are data, not modules. Without this an
# installed copy imports fine and then 500s on the first render.
"web" = ["templates/**/*.html", "templates/*.css", "static/*"]
"pipeline" = ["filters/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
